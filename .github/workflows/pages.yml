name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # web/package.json の packageManager と同じ版に固定する。
      - name: Set up pnpm
        run: npm install -g pnpm@10.30.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Build static export
        run: pnpm build
        working-directory: web
        env:
          # プロジェクトサイト（<org>.github.io/auth-with-webview/）で配信するため、
          # リポジトリ名を basePath に指定する。カスタムドメインでルート配信するなら空にする。
          BASE_PATH: /auth-with-webview
          # Repository variable を true にすると公開サイトで vConsole を有効化する。
          NEXT_PUBLIC_VCONSOLE: ${{ vars.NEXT_PUBLIC_VCONSOLE }}
      - name: Upload Pages artifact
        # include-hidden-files（web/out/.nojekyll などを取り込む）は v3.0.1 以降のみ対応。
        # `@v3` タグは v3.0.0 を指すため、明示的にパッチ版へ固定する。
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: web/out
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
